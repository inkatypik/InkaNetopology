services:
  inkanetopology:
    # Image hébergée sur GitHub Container Registry (GHCR)
    image: ghcr.io/inkatypik/inkanetopology:latest
    # Build local optionnel lors de l'exécution avec 'docker compose up --build'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkanetopology-scanner
    restart: unless-stopped
    # IMPORTANT: network_mode 'host' permet d'accéder directement aux interfaces
    # réseau physiques de la machine hôte pour le scan ARP, mDNS et sockets sans NAT.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # CRITIQUE : Définissez ici votre chemin de stockage local (machine hôte)
      # selon votre environnement et contexte (ex: OpenMediaVault, Synology, Debian, Ubuntu).
      # Remplacez /chemin/vers/votre/dossier/data par votre chemin de stockage réel :
      #   Ex. OpenMediaVault : /srv/dev-disk-by-uuid-.../DOCKER/inkanetopology/data:/app/data
      #   Ex. Linux standard : /opt/inkanetopology/data:/app/data
      #   Ex. Synology NAS   : /volume1/docker/inkanetopology/data:/app/data
      - /chemin/vers/votre/dossier/data:/app/data
      # Montage optionnel du socket Docker pour l'identification automatique des conteneurs locaux
      - /var/run/docker.sock:/var/run/docker.sock:ro
